<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои Задачи</title>
    
    <!-- ССЫЛКИ ДЛЯ PWA (чтобы можно было установить) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #bb86fc; --success: #03dac6; --priority-high: #ff5252; --priority-med: #ffd740; --priority-low: #69f0ae; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: var(--accent); text-align: center; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; min-width: 150px; }
        select { padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 14px; cursor: pointer; }
        #customIntervalInput { display: none; width: 80px; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: var(--card); color: var(--text); font-size: 16px; }
        #customIntervalInput.visible { display: block; }
        
        /* Поле даты */
        #dueDateInput { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background-color: var(--card); 
            color: var(--text); 
            font-size: 14px; 
            width: 100%; 
            color-scheme: dark;
        }
        
        button.add-btn { padding: 12px 20px; border: none; border-radius: 8px; background-color: var(--accent); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; flex-basis: 100%; }

        .stats-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .stat-item { flex: 1; background: var(--card); padding: 15px 5px; border-radius: 12px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; }
        .stat-value { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
        .stat-done .stat-value { color: var(--success); }
        .stat-overdue .stat-value { color: var(--priority-high); }
        .stat-active .stat-value { color: var(--accent); }

        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item { background-color: var(--card); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; border-left: 4px solid #333; }
        .task-item.p-high { border-left-color: var(--priority-high); }
        .task-item.p-med { border-left-color: var(--priority-med); }
        .task-item.p-low { border-left-color: var(--priority-low); }
        .task-item.done { opacity: 0.5; background-color: #181818; border-left-color: #444; }
        .task-item.done .task-title { text-decoration: line-through; color: #888; }
        
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .task-title-wrapper { flex: 1; }
        .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .task-title { font-size: 16px; word-break: break-word; }
        .priority-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .p-high .priority-badge { background: rgba(255, 82, 82, 0.2); color: var(--priority-high); }
        .p-med .priority-badge { background: rgba(255, 215, 64, 0.2); color: var(--priority-med); }
        .p-low .priority-badge { background: rgba(105, 240, 174, 0.2); color: var(--priority-low); }
        
        .repeat-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; }
        
        .task-actions { display: flex; gap: 5px; align-items: center; }
        .check-btn { background: none; border: 2px solid #444; border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; color: transparent; }
        .check-btn.done { background-color: var(--success); border-color: var(--success); color: #000; }
        .delete-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; }
        
        .progress-controls { display: flex; align-items: center; gap: 10px; background: #252525; padding: 8px 12px; border-radius: 8px; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: transparent; height: 6px; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #333; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--accent); -webkit-appearance: none; margin-top: -5px; }
        input[type="number"] { width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #444; background: var(--bg); color: var(--text); text-align: center; }
        .percent-sign { font-size: 14px; color: #888; }
        .empty-msg { text-align: center; color: #666; margin-top: 40px; font-style: italic; }
    </style>
</head>
<body>
    <h1>📱 Мои Задачи</h1>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <select id="priorityInput">
            <option value="low">Низкий</option>
            <option value="med" selected>Средний</option>
            <option value="high">Высокий</option>
        </select>
        <select id="repeatInput" onchange="toggleCustomInterval()">
            <option value="none" selected>Не повторять</option>
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="custom">Свой интервал...</option>
        </select>
        <input type="number" id="customIntervalInput" min="1" placeholder="Дней">
        
        <input type="date" id="dueDateInput">
        
        <button class="add-btn" id="addBtn">+ Добавить</button>
    </div>

    <div class="stats-bar">
        <div class="stat-item stat-done">
            <div class="stat-value" id="statDone">0</div>
            <div class="stat-label">Выполнено</div>
        </div>
        <div class="stat-item stat-overdue">
            <div class="stat-value" id="statOverdue">0</div>
            <div class="stat-label">Просрочено</div>
        </div>
        <div class="stat-item stat-active">
            <div class="stat-value" id="statActive">0</div>
            <div class="stat-label">Активных</div>
        </div>
    </div>

    <div class="task-list" id="taskList"></div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('my_local_tasks')) || [];
        
        const taskInput = document.getElementById('taskInput');
        const priorityInput = document.getElementById('priorityInput');
        const repeatInput = document.getElementById('repeatInput');
        const customIntervalInput = document.getElementById('customIntervalInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const dueDateInput = document.getElementById('dueDateInput');

        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
        }

        function toggleCustomInterval() {
            if (repeatInput.value === 'custom') customIntervalInput.classList.add('visible');
            else customIntervalInput.classList.remove('visible');
        }

        function saveLocal() { localStorage.setItem('my_local_tasks', JSON.stringify(tasks)); }

        function getRepeatText(type) {
            if (!type || type === 'none') return '';
            if (type === 'daily') return 'Каждый день';
            if (type === 'weekly') return 'Каждую неделю';
            if (!isNaN(parseInt(type))) return `Каждые ${type} дн.`;
            return 'Повтор';
        }

        function getDueBadge(task) {
            if (!task.due_date) return '';
            const today = new Date().toISOString().split('T')[0];
            if (task.due_date < today && task.progress < 100) {
                return '<span class="repeat-badge" style="background:#ff5252; color:#fff;">Просрочено</span>';
            } else if (task.due_date === today && task.progress < 100) {
                return '<span class="repeat-badge" style="background:#ffd740; color:#000;">Сегодня</span>';
            } else {
                return `<span class="repeat-badge" style="background:#333;">До ${task.due_date}</span>`;
            }
        }

        function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            let done = 0, overdue = 0, active = 0;

            tasks.forEach(task => {
                if (task.progress === 100) {
                    done++;
                } else {
                    if (task.due_date && task.due_date < today) overdue++;
                    active++;
                }
            });

            document.getElementById('statDone').innerText = done;
            document.getElementById('statOverdue').innerText = overdue;
            document.getElementById('statActive').innerText = active;
        }

        function renderTasks() {
            taskList.innerHTML = '';
            updateStats();

            if (tasks.length === 0) {
                taskList.innerHTML = `<div class="empty-msg">Пусто. Добавь первую задачу!</div>`;
                return;
            }

            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                const isDone = task.progress === 100 ? 'done' : '';
                div.className = `task-item p-${task.priority} ${isDone}`;
                
                const repeatText = getRepeatText(task.repeat_type);
                let repeatHtml = repeatText ? `<span class="repeat-badge">${repeatText}</span>` : '';
                const dueHtml = getDueBadge(task);

                div.innerHTML = `
                    <div class="task-header">
                        <div class="task-title-wrapper">
                            <div class="title-row">
                                <span class="task-title">${task.title}</span>
                                <span class="priority-badge">${task.priority}</span>
                                ${repeatHtml}
                                ${dueHtml}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleComplete(${index})">✓</button>
                            <button class="delete-btn" onclick="deleteTask(${index})">🗑️</button>
                        </div>
                    </div>
                    <div class="progress-controls">
                        <input type="range" min="0" max="100" value="${task.progress}" oninput="updateProgress(${index}, this.value)">
                        <input type="number" min="0" max="100" value="${task.progress}" onchange="updateProgress(${index}, this.value)">
                        <span class="percent-sign">%</span>
                    </div>
                `;
                taskList.appendChild(div);
            });
        }

        function addTask() {
            const title = taskInput.value.trim();
            if (!title) return;
            
            let repeatType = repeatInput.value;
            if (repeatType === 'custom') {
                const days = parseInt(customIntervalInput.value);
                if (days > 0) repeatType = days.toString();
                else repeatType = 'none';
            }

            const newTask = { 
                title: title, 
                priority: priorityInput.value, 
                repeat_type: repeatType,
                due_date: dueDateInput.value,
                progress: 0, 
                created_at: new Date().toISOString()
            };
            tasks.unshift(newTask);
            taskInput.value = '';
            customIntervalInput.value = '';
            dueDateInput.value = '';
            saveLocal(); 
            renderTasks();
        }

        function updateProgress(index, value) {
            let val = parseInt(value);
            if (isNaN(val)) val = 0;
            if (val < 0) val = 0; if (val > 100) val = 100;
            tasks[index].progress = val;
            saveLocal(); 
            renderTasks(); 
        }

        function toggleComplete(index) {
            const task = tasks[index];
            if (task.progress === 100 && task.repeat_type !== 'none') {
                task.progress = 0;
                task.created_at = new Date().toISOString();
                alert('Задача выполнена! Прогресс сброшен для следующего повторения.');
            } else {
                task.progress = task.progress === 100 ? 0 : 100;
            }
            saveLocal(); 
            renderTasks();
        }

        function deleteTask(index) {
            if (!confirm('Удалить?')) return;
            tasks.splice(index, 1);
            saveLocal(); 
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') addTask(); });
        
        renderTasks();
    </script>
</body>
</html>
